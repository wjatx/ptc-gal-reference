# ── EXTRACT ASSET ─────────────────────────────────────────────────────────────
# This file REPLACES the source pyproject.toml when the public reference
# implementation is cut. It exists for one reason: the source declares a console
# script pointing into a package the cut excludes, and shipping that would put a
# broken command in public package metadata.
#
# MAINTENANCE HAZARD, stated because it is real: this is a full copy, so a
# dependency or version change in the source pyproject.toml does NOT reach here.
# Re-generate it from the source when either changes. Nothing enforces that yet.
# ──────────────────────────────────────────────────────────────────────────────
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-agents"
version = "0.72.0"
description = "safe-agents — the trusted-autonomy base platform SDK (deterministic tool broker, agent pipeline, cloud arms, runner-contract harness)."
readme = "README.md"
# Declared as an SPDX expression rather than a file reference. This repo is private and carries no
# LICENSE file [ruling: maintainer, 2026-08-10]; the public reference implementation extracted from it does,
# supplied as extract/assets/LICENSE. A `file = "LICENSE"` reference would break the build here and
# resolve differently there, which is exactly the two-truths shape the one-way extract avoids.
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
# Hard runtime deps: the schemas need pydantic; the pipeline/watcher parse YAML
# manifests at import time. boto3 is deliberately NOT here — every AWS call site
# imports it lazily so the SDK stays importable (and unit-testable) with no cloud
# credentials or SDK present. Install the `aws` extra to actually reach AWS.
dependencies = [
    "pydantic>=2.13.4",
    "PyYAML>=6.0",
    # Ed25519 signing/verification of the outbound provenance chain
    # (channels/SIGNING.md) — asymmetric, for non-repudiable cross-broker
    # lineage the receiver can attribute to the signing broker.
    "cryptography>=42.0",
    # ISO-8601 duration parsing at the risky time edges (sa#214: labelLatency
    # validation) — Rust-backed; the stdlib stays for the UTC-pure core.
    "whenever>=0.10.2,<0.11",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34",
]
# The official MCP python SDK, used ONLY by the reference MCP host client
# (safe_agents/broker/mcp/client.py). It is optional so the base package imports
# with no SDK present: client.py imports it lazily and discovery.py (the gate)
# has zero SDK dependency. Lower bound RAISED to 1.25 by #237: the remote
# transport now uses `streamable_http_client` + `create_mcp_http_client`, which
# the deprecated `streamablehttp_client` predates. Verified present on both 1.25
# and 1.28.1 (the resolved current); pinning the floor beats carrying a
# feature-detected dual path for a transport whose credential delivery is the
# whole point of the seam.
# Ceiling added 2026-07-28: `mcp` 2.0.0 removed `mcp.server.fastmcp`, which
# examples/restricted_mcp_server/server.py imports — so an unbounded range made
# every fresh install (and every container rebuild) a different SDK behind an
# unchanged tag. Lifting the ceiling is a migration, tracked separately.
mcp = [
    "mcp>=1.25,<2",
]
dev = [
    "safe-agents[aws]",
    "safe-agents[mcp]",
    "pytest>=8.0",
    # moto's DynamoDB/S3 mocks validate the real Condition/Update expression
    # syntax, so broker's store tests (test_dynamo_stores.py sa#101,
    # test_s3_sink_resume.py sa#104) run in CI with no container or live AWS.
    "moto[dynamodb,s3]>=5.0",
    "ruff==0.15.20",
]

[project.scripts]
# The pipeline CLI: provision → deploy → smoke a manifest-declared agent.
safe-agents = "safe_agents.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["safe_agents*", "reliability*"]
# Tests ship with the source tree (and stay collectible under an editable
# install) but are excluded from the built distribution.
exclude = ["*.tests", "*.tests.*"]

# Ship the arms' non-Python deploy assets (user-data templates, bootstrap
# scripts, systemd units, Image Builder configs) and example/prototype
# manifests, so an installed SDK can actually provision — not just import.
[tool.setuptools.package-data]
"*" = [
    "*.tmpl",
    "*.sh",
    "*.yaml",
    "*.yml",
    "*.json",
    "*.jsonl",
    "*.service",
    "*.timer",
    "*.conf",
    "*.template",
    "*.txt",
    "*.agent",
    "*.broker",
    "Containerfile*",
]

[tool.pytest.ini_options]
# Bare `pytest` from the repo root runs the whole platform suite. The no-sleep
# fixture in safe_agents/conftest.py is scoped to the safe_agents subtree only.
testpaths = ["safe_agents", "reliability", "observability"]
markers = [
    "stdio: spawns a real MCP server child process over stdio transport (#219)",
    "corpus: exhaustive sweep over a whole input space (#177/#178 PDP differential corpus)",
]
