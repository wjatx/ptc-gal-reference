# policies/smoke-fargate.yaml — network-egress confinement policy for the
# smoke-fargate task (the sa#36 Fargate arm smoke fixture).
#
# Under the broker model the agent process may reach only the broker endpoint and
# api.anthropic.com. Connector IPs must never appear in agent_egress; all connector
# traffic routes through the broker.
#
# Enforcement on the Fargate arm: a scheduled ECS/Fargate task in an isolated agent
# subnet + security group whose only outbound route is the broker — which runs as its
# own ECS service and is also the model-inference proxy for api.anthropic.com. The
# broker endpoint is added implicitly by the arm adapter at deploy time.

agent_egress:
  allow_hosts:
    - api.anthropic.com    # model API (required for all arms; reached only via the broker proxy)
    # broker endpoint is added implicitly by the arm adapter; do not list it here
    # as a raw IP — it will vary by environment
  deny_by_default: true
