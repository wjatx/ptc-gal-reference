schemaVersion: 1.0

# safe-agents base-AMI component (AWSTOE format for EC2 Image Builder).
#
# Target platform: arm64 Amazon Linux 2023.
# Installs: toolchain (git / python3) + AWS CLI v2 + Claude Code CLI.
# The bake runs in CI where internet egress exists. The deployed instance never
# needs internet access: agent code arrives via the S3 gateway endpoint at boot.
#
# No Node.js. Claude Code is a native binary and needs none, and nothing else on
# the box uses it; the validate phase fails the bake if node or npm is on the image.
#
# Pinned downloads (safe_agents/arms/toolchain/README.md):
#   - No bundle exists on the build instance, so no step can source fetch-verified.sh.
#     Every download is the canonical inline form instead: one line whose URL and SHA-256
#     are a line of toolchain/artifacts.lock, for linux-aarch64. A hash mismatch or a
#     pruned URL exits the step and fails the bake. Move a pin with
#     scripts/update-artifact-pin.py, which rewrites this file.
#   - dnf installs named packages from Amazon Linux's own signed repositories.
#
# Component 2.0.0 was baked once: on 2026-10-02, in us-east-1, on c7g.medium. In that
# build VerifyInstalls printed `2.1.285 (Claude Code)` and `aws-cli/2.37.8`, and the
# validate phase passed (no node or npm, managed settings present). That is one build on
# one day; a later bake takes a different parent image and different dnf packages. This
# note was written after that bake, so the header of the component that was baked does
# not contain it.
#
# Deploy with:
#   aws imagebuilder create-component \
#     --name safe-agents-base \
#     --semantic-version 2.0.0 \
#     --platform Linux \
#     --supported-os-versions '["Amazon Linux 2023"]' \
#     --data file://component-base.yaml \
#     --region <REGION>
#
# HARNESS-COUPLING BLOCK: only the ClaudeCodeCLI step below couples safe-agents
# to Claude Code specifically. All other steps are harness-neutral.
# To swap harnesses: replace ONLY that step.

phases:
  - name: build
    steps:
      - name: UpdateOS
        action: ExecuteBash
        inputs:
          commands:
            - dnf update -y --quiet

      - name: InstallToolchain
        action: ExecuteBash
        inputs:
          commands:
            # git — deploy-key clone and local git ops.
            # python3 / python3-pip — runner scripts.
            # unzip — needed to unpack the AWS CLI v2 installer zip (see InstallAWSCLI).
            # python3-pyyaml — the conformance harness imports yaml; must be available
            #                  on the system python3 path. The harness arrives via S3 at
            #                  boot (not baked here) but the import happens at runtime.
            # iptables-nft — the netns forwards to the broker service; agent-netns-setup.sh
            #                MASQUERADEs the veth /30 out the uplink. No internet at
            #                boot in the isolated subnet, so this MUST be baked, not dnf'd later.
            - dnf install -y --quiet git python3 python3-pip unzip python3-pyyaml iptables-nft

      - name: InstallAWSCLI
        action: ExecuteBash
        inputs:
          commands:
            # 'awscli2' is NOT a valid AL2023 dnf package. Install the official
            # AWS CLI v2 from its pinned arm64 / aarch64 release archive.
            # user-data.sh.tmpl calls 'aws s3 cp' and 'aws secretsmanager' at boot;
            # the CLI must be pre-installed because user-data is config-only.
            - u=https://awscli.amazonaws.com/awscli-exe-linux-aarch64-2.37.8.zip; h=00c4bac1cac8624b728d991f821428d5de1e0cb56e3803045b85bff63bedee8b; d=/tmp/awscliv2.zip; a=; curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$d" "$u" && a=$(sha256sum "$d" | cut -d' ' -f1); [ "$a" = "$h" ] || { echo "fetch_verified FAILED $u expected sha256 $h, got ${a:-no file}" >&2; rm -f "$d"; exit 1; }
            - unzip -q /tmp/awscliv2.zip -d /tmp
            - /tmp/aws/install
            - rm -rf /tmp/aws /tmp/awscliv2.zip

      # -- HARNESS-COUPLING BLOCK START --------------------------------------
      # This step is ONE OF ONLY TWO places safe-agents couples to Claude Code
      # specifically (the other is the SessionStart memory loader).
      # All other steps above and below are harness-neutral.
      # To swap harnesses: replace ONLY this step.
      #
      # Installs the Claude Code native binary from its pinned arm64 release: one
      # self-contained executable that needs no Node.js. It is never installed with npm.
      # The managed settings set DISABLE_UPDATES=1, so the binary never updates itself
      # past the pin. Token injection happens at boot from Secrets Manager, NOT here.
      - name: ClaudeCodeCLI
        action: ExecuteBash
        inputs:
          commands:
            - u=https://downloads.claude.ai/claude-code-releases/2.1.285/linux-arm64/claude; h=24fac77749bed3d91365d6b6915aa4b824e14318ecb6bc17adbc192f01c9173d; d=/tmp/claude; a=; curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$d" "$u" && a=$(sha256sum "$d" | cut -d' ' -f1); [ "$a" = "$h" ] || { echo "fetch_verified FAILED $u expected sha256 $h, got ${a:-no file}" >&2; rm -f "$d"; exit 1; }
            - install -m 0755 /tmp/claude /usr/local/bin/claude
            - rm -f /tmp/claude
            - |
              install -d -m 0755 /etc/claude-code
              python3 - /etc/claude-code/managed-settings.json <<'PY'
              import json, pathlib, sys

              path = pathlib.Path(sys.argv[1])
              settings = json.loads(path.read_text()) if path.exists() else {}
              settings.setdefault("env", {})["DISABLE_UPDATES"] = "1"
              path.write_text(json.dumps(settings, indent=2) + "\n")
              PY
              chmod 0644 /etc/claude-code/managed-settings.json
      # -- HARNESS-COUPLING BLOCK END ----------------------------------------

      - name: CreateDirectoryLayout
        action: ExecuteBash
        inputs:
          commands:
            # /opt/agents               — agent packages are extracted here at boot.
            # /opt/broker               — broker sidecar binary + credentials file (brokerRole only).
            # /opt/safe-agents/core     — platform substrate dir; populated at boot via S3
            #                            (the conformance harness arrives as a platform bundle,
            #                            not baked here, so no git token is needed at bake time).
            - mkdir -p /opt/agents /opt/broker /opt/safe-agents/core
            - chmod 755 /opt/agents /opt/broker /opt/safe-agents /opt/safe-agents/core

      - name: VerifyInstalls
        action: ExecuteBash
        inputs:
          commands:
            # Fail the bake early if any tool is missing rather than shipping a
            # broken AMI. The Claude Code binary is RUN, not just found: a file that
            # cannot execute on this host fails here. HOME is set for it in case the
            # build agent's shell has none.
            # The conformance harness (harness.py) is NOT checked here — it arrives
            # via the S3 platform bundle at boot, not at bake time.
            - git --version
            - python3 --version
            - export PATH="/usr/local/bin:$PATH"; which claude
            - export PATH="/usr/local/bin:$PATH" HOME="${HOME:-/root}"; DISABLE_UPDATES=1 claude --version
            - aws --version

  - name: validate
    steps:
      - name: ValidateDirectoryLayout
        action: ExecuteBash
        inputs:
          commands:
            - test -d /opt/agents
            - test -d /opt/broker
            # aws CLI installed via the official installer (not awscli2 dnf package).
            - aws --version
            # The harness (harness.py) arrives at boot via S3; not checked here.
            # The harness imports yaml; verify the system python3 can import it.
            - python3 -c "import yaml; print('pyyaml ok')"

      - name: ValidatePinnedHarness
        action: ExecuteBash
        inputs:
          commands:
            - export PATH="/usr/local/bin:$PATH" HOME="${HOME:-/root}"; DISABLE_UPDATES=1 claude --version
            # The managed settings must carry the update lock, or the baked CLI could move
            # past its pin.
            - python3 -c "import json; assert json.load(open('/etc/claude-code/managed-settings.json'))['env']['DISABLE_UPDATES'] == '1'"
            # No Node.js on the base image (see the header).
            - export PATH="/usr/local/bin:$PATH"; if command -v node || command -v npm; then echo "Node.js must not be on the EC2 base AMI" >&2; exit 1; fi
