# Leg 1 of 3 — the MAKER half, under its own ServiceAccount.
#
# Phase 2 ran the whole ceremony in ONE pod under two local roles it flipped
# between, and the record honestly said so (`attestation: solo-local`). Under the
# serviceaccount arm one pod is one credential, so the arc necessarily splits:
# a pod cannot hold both halves, which is the point.
#
# The issuer Secret is NOT mounted here, and this pod's ServiceAccount has no
# RoleBinding at all. Both facts are demonstrated from inside by cluster-propose.sh
# rather than asserted from this file.
apiVersion: batch/v1
kind: Job
metadata:
  name: safe-agents-propose
  namespace: safe-agents
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safe-agents
        app.kubernetes.io/component: propose
    spec:
      serviceAccountName: safe-agents-maker
      restartPolicy: Never
      containers:
        - name: propose
          image: image-registry.openshift-image-registry.svc:5000/safe-agents/safe-agents-missileer:arc
          # A MUTABLE TAG NEEDS AN EXPLICIT PULL POLICY. `:arc` is not `:latest`,
          # so Kubernetes defaults to IfNotPresent — and because every run
          # rebuilds the SAME tag, a node that already has an older `:arc`
          # silently keeps running it. That failure is quiet and misleading: the
          # pod comes up healthy and fails somewhere unrelated to what changed.
          # (Found here when a rebuilt image kept reporting the pre-Phase-3
          # "cannot derive the ceremony identity from AWS STS", which is the
          # correct behaviour of code that never heard of the new selector.)
          imagePullPolicy: Always
          command: ["bash", "/opt/drill/cluster-propose.sh"]
          env:
            # The whole Phase 3 change, in one variable. The closed catalog is
            # {sts, local, serviceaccount}; unset keeps the pre-Phase-3 dispatch.
            - { name: BROKER_CEREMONY_IDENTITY, value: serviceaccount }
            - { name: BROKER_STORE, value: sqlite }
            - { name: BROKER_SQLITE_PATH, value: /var/lib/broker/broker.db }
            # The #203 write split. This pod mounts the grant store READ-ONLY,
            # so the refusal on a GRANT#/TOOLDEF# write is the kernel's, not a
            # check of ours. The flag below only tells the store to OPEN it
            # read-only — it grants nothing when cleared, because clearing it on
            # a read-only mount buys a loud open failure, not write access.
            - { name: BROKER_SQLITE_GRANTS_PATH, value: /var/lib/broker-grants/grants.db }
            - { name: BROKER_SQLITE_GRANTS_READONLY, value: "1" }
            - { name: BROKER_MANIFEST, value: /app/examples/restricted_mcp_server/manifest.yaml }
            - { name: BROKER_SECRETS, value: dir }
            - { name: BROKER_SECRETS_DIR, value: /run/connector-secrets }
            # Deliberately NO BROKER_AUDIT_PATH (#310). All four legs used to set
            # it; three of them never construct an audit sink at all — only
            # `broker_server.build_runtime` does, and the ceremony commands
            # (`grants.commands`, `mcp.commands`) do not call it. Leaving the
            # variable pointing at what is now a read-only mount would turn the
            # first ceremony command that DID emit a record into a mount error
            # instead of a policy refusal, at the worst possible moment.
            #
            # Unset is the loud option, not the silent one: a durable store with
            # no audit sink is refused at boot by F3
            # (`boot_config.require_named_real_backends`), which says exactly
            # which variable to set. The rejected alternative — repointing each
            # leg at its own tape under `work/` — would mint three tapes in the
            # mutually-writable half, carrying a weaker claim than the broker's
            # for records nothing writes.
            - { name: BROKER_GRANT_LOAD, value: read }
            # Deliberately NO ISSUER_SIGNING_KEY_* of any kind: this pod cannot
            # sign, and half-configured signing REFUSES anyway (#201).
            - name: BROKER_HMAC_KEY
              valueFrom:
                secretKeyRef: { name: safe-agents-hmac, key: hmac-key }
          volumeMounts:
            # THREE subPaths off the ONE claim: work, grants, audit. The working half
            # stays writable (this pod writes the snapshot and the proposal-id
            # breadcrumb into it), the grant half is read-only. That asymmetry is the
            # whole control, and it is why the split is a DIRECTORY split — a blanket
            # readOnly here would break the maker for reasons that have nothing to do
            # with grants.
            #
            # This used to claim "this pod writes audit.jsonl". It does not, and has
            # not since #310: the tape lives on its own subPath, this leg mounts it
            # read-only, and the ceremony legs no longer set BROKER_AUDIT_PATH at all.
            # Corrected 2026-07-29.
            - { name: store, mountPath: /var/lib/broker, subPath: work }
            - { name: store, mountPath: /var/lib/broker-grants, subPath: grants, readOnly: true }
            # The #310 split — read-only here. Nothing in this leg reads or
            # writes it; it is mounted so the tamper leg's claim is about the
            # SAME topology every ceremony pod runs under, rather than a
            # special-cased pod built to be refused.
            - { name: store, mountPath: /var/lib/broker-audit, subPath: audit, readOnly: true }
            - { name: connector-secrets, mountPath: /run/connector-secrets, readOnly: true }
            - { name: drill, mountPath: /opt/drill, readOnly: true }
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: safe-agents-store
        - name: connector-secrets
          secret:
            secretName: safe-agents-connector-secrets
        - name: drill
          configMap:
            name: safe-agents-drill-scripts
