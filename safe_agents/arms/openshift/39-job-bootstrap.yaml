# Leg 0 of 4 — bootstrap the grant store, under the CHECKER ServiceAccount.
#
# Numbered 39 rather than renumbering 40/41/42, because those numbers are cited
# in the session summaries and issue comments that are this epic's evidence
# trail; a renumber would silently invalidate every one of those references.
#
# Why this leg exists is a consequence of the #203 write split rather than a
# convenience. The grant database is mounted READ-ONLY into the maker's pod, and
# a read-only open cannot create the file it opens — deliberately, because a
# store that was never created is a deployment error, not an empty store, and
# reading absence as "no grants exist" fails toward MORE authority for a maker
# assembling evidence. So the store must exist before the maker runs, and only
# an identity that may write it can put it there.
#
# This is the only leg besides ratify that mounts the issuer key: `seed` signs
# the bootstrap records it mints.
apiVersion: batch/v1
kind: Job
metadata:
  name: safe-agents-bootstrap
  namespace: safe-agents
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safe-agents
        app.kubernetes.io/component: bootstrap
    spec:
      serviceAccountName: safe-agents-checker
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: image-registry.openshift-image-registry.svc:5000/safe-agents/safe-agents-missileer:arc
          # A MUTABLE TAG NEEDS AN EXPLICIT PULL POLICY — see 41-job-ratify.yaml.
          imagePullPolicy: Always
          command: ["bash", "/opt/drill/cluster-bootstrap.sh"]
          env:
            - { name: BROKER_CEREMONY_IDENTITY, value: serviceaccount }
            - { name: BROKER_STORE, value: sqlite }
            - { name: BROKER_SQLITE_PATH, value: /var/lib/broker/broker.db }
            # The #203 split. Checker-writable key space, its own file, its own
            # mount — read-write here, read-only in the maker and serve pods.
            - { name: BROKER_SQLITE_GRANTS_PATH, value: /var/lib/broker-grants/grants.db }
            - { name: BROKER_MANIFEST, value: /app/examples/restricted_mcp_server/manifest.yaml }
            - { name: BROKER_SECRETS, value: dir }
            - { name: BROKER_SECRETS_DIR, value: /run/connector-secrets }
            # Deliberately NO BROKER_AUDIT_PATH — see 40-job-propose.yaml.
            - { name: BROKER_GRANT_LOAD, value: read }
            - { name: ISSUER_SIGNING_KEY_ID, value: openshift-drill-issuer-1 }
            - { name: ISSUER_SIGNING_ZONE, value: local }
            - name: BROKER_HMAC_KEY
              valueFrom:
                secretKeyRef: { name: safe-agents-hmac, key: hmac-key }
          volumeMounts:
            # THREE subPaths off the ONE claim: work, grants, audit. The split is a
            # directory split rather than a file split because the working half
            # carries the sqlite store, the snapshot and the inter-leg breadcrumbs
            # — a blanket readOnly on /var/lib/broker would break the maker for
            # reasons that have nothing to do with grants.
            #
            # It used to say the working half "also carries audit.jsonl". #310 moved
            # the tape to its own subPath (below) precisely so it was no longer in
            # the mutually-writable half; this comment described the world before
            # that and was corrected 2026-07-29.
            - { name: store, mountPath: /var/lib/broker, subPath: work }
            - { name: store, mountPath: /var/lib/broker-grants, subPath: grants }
            # The #310 split. Mounted, and read-only: this leg has no business
            # writing the broker's tape, and mounting it read-only rather than
            # not at all is what lets a leg ATTEMPT the write and be refused.
            - { name: store, mountPath: /var/lib/broker-audit, subPath: audit, readOnly: true }
            - { name: issuer-projected, mountPath: /run/issuer-projected, readOnly: true }
            - { name: issuer-private, mountPath: /run/issuer-private }
            - { name: connector-secrets, mountPath: /run/connector-secrets, readOnly: true }
            - { name: drill, mountPath: /opt/drill, readOnly: true }
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: safe-agents-store
        - name: issuer-projected
          secret:
            secretName: safe-agents-issuer
            # No defaultMode: the mode is not ours to choose (#282).
        - name: issuer-private
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: connector-secrets
          secret:
            secretName: safe-agents-connector-secrets
        - name: drill
          configMap:
            name: safe-agents-drill-scripts
