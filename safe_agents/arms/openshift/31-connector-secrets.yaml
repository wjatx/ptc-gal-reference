# The manifest's connector_secrets leaves (sa#164 bare-leaf convention), as the
# `dir` secrets arm consumes them: one file per leaf (#248).
#
# Empty values are the honest content here. The Doer resolves a credential for
# EVERY connector before dispatch, so a credential-less local MCP server still
# needs a provisioned leaf — an empty placeholder, not a fake credential.
#
# This is the ONE secret in this arm that is safe to commit, precisely because it
# holds nothing. The issuer signing key and the broker HMAC key are generated
# per-run by cluster-arc-run.sh and never touch the repo.
apiVersion: v1
kind: Secret
metadata:
  name: safe-agents-connector-secrets
  namespace: safe-agents
type: Opaque
data:
  ledger-mcp-placeholder: ""
  peer-mcp-example: ""
