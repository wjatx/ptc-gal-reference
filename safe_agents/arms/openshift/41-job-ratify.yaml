# Leg 2 of 3 — the CHECKER half, under a different ServiceAccount, and the ONLY
# workload into which the issuer signing Secret is mounted.
#
# That mount asymmetry IS the maker!=checker backstop, and it is worth being
# precise about why, because the loose version of the claim is wrong:
#
#   RBAC governs API access, NOT kubelet volume mounts. "The maker SA cannot
#   read the Secret" would not by itself stop a maker-authored pod from
#   mounting it. What closes the loop is that the maker's credential ALSO
#   cannot create a workload — so it can neither read the key nor arrange for
#   it to be delivered. cluster-propose.sh attempts both and shows the 403s.
#
# Note there is deliberately no RoleBinding granting the CHECKER API access to
# this Secret either. It receives the key by mount, which is what the epic's
# "files, not API" rule asks for: a standing RBAC grant to read a signing key is
# broader authority than mounting exactly what is needed.
apiVersion: batch/v1
kind: Job
metadata:
  name: safe-agents-ratify
  namespace: safe-agents
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safe-agents
        app.kubernetes.io/component: ratify
    spec:
      serviceAccountName: safe-agents-checker
      restartPolicy: Never
      containers:
        - name: ratify
          image: image-registry.openshift-image-registry.svc:5000/safe-agents/safe-agents-missileer:arc
          # A MUTABLE TAG NEEDS AN EXPLICIT PULL POLICY. `:arc` is not `:latest`,
          # so Kubernetes defaults to IfNotPresent — and because every run
          # rebuilds the SAME tag, a node that already has an older `:arc`
          # silently keeps running it. That failure is quiet and misleading: the
          # pod comes up healthy and fails somewhere unrelated to what changed.
          # (Found here when a rebuilt image kept reporting the pre-Phase-3
          # "cannot derive the ceremony identity from AWS STS", which is the
          # correct behaviour of code that never heard of the new selector.)
          imagePullPolicy: Always
          command: ["bash", "/opt/drill/cluster-ratify.sh"]
          env:
            - { name: BROKER_CEREMONY_IDENTITY, value: serviceaccount }
            - { name: BROKER_STORE, value: sqlite }
            - { name: BROKER_SQLITE_PATH, value: /var/lib/broker/broker.db }
            # The #203 split — read-WRITE here. This is the identity the grant
            # key space belongs to.
            - { name: BROKER_SQLITE_GRANTS_PATH, value: /var/lib/broker-grants/grants.db }
            - { name: BROKER_MANIFEST, value: /app/examples/restricted_mcp_server/manifest.yaml }
            - { name: BROKER_SECRETS, value: dir }
            - { name: BROKER_SECRETS_DIR, value: /run/connector-secrets }
            # Deliberately NO BROKER_AUDIT_PATH — see 40-job-propose.yaml. Note
            # this leg holds the signing key and STILL cannot write the tape:
            # the audit split excludes the checker exactly as it excludes the
            # maker, because "another leg's records" means any other leg's.
            - { name: BROKER_GRANT_LOAD, value: read }
            - { name: ISSUER_SIGNING_KEY_ID, value: openshift-drill-issuer-1 }
            - { name: ISSUER_SIGNING_ZONE, value: local }
            - name: BROKER_HMAC_KEY
              valueFrom:
                secretKeyRef: { name: safe-agents-hmac, key: hmac-key }
          volumeMounts:
            - { name: store, mountPath: /var/lib/broker, subPath: work }
            - { name: store, mountPath: /var/lib/broker-grants, subPath: grants }
            # The #310 split — read-only, even here. Write access to the grant
            # key space does not carry write access to the tape that records
            # what was done with it.
            - { name: store, mountPath: /var/lib/broker-audit, subPath: audit, readOnly: true }
            - { name: issuer-projected, mountPath: /run/issuer-projected, readOnly: true }
            - { name: issuer-private, mountPath: /run/issuer-private }
            - { name: connector-secrets, mountPath: /run/connector-secrets, readOnly: true }
            - { name: drill, mountPath: /opt/drill, readOnly: true }
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: safe-agents-store
        - name: issuer-projected
          secret:
            secretName: safe-agents-issuer
            # No defaultMode: the mode is not ours to choose. The kubelet ORs
            # 0440 into whatever is requested whenever an fsGroup is in force,
            # and restricted-v2 always assigns one (#282, verified 8/8).
        - name: issuer-private
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: connector-secrets
          secret:
            secretName: safe-agents-connector-secrets
        - name: drill
          configMap:
            name: safe-agents-drill-scripts
