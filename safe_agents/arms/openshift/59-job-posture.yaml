# The posture leg (#250 Phase 6.1) — the report, generated where the containment is.
#
# Runs under the AGENT ServiceAccount and carries the agent's pod label, so it is
# selected by the same default-deny egress policy and constrained by the same SCC
# as the workload it describes. That is not decoration: a posture report generated
# in an unconstrained pod would observe an unconstrained pod, and say so
# correctly, about the wrong thing.
#
# Like the agent leg it declares NO volume but the drill ConfigMap — so the report
# it produces is the honest one for a workload holding nothing, and the CLUSTER
# section's mount line has something true to say rather than a mount to describe.
#
# The posture home is /tmp deliberately. The agent pod has no PVC and must not grow
# one to make a report run; posture handles an absent store by saying so
# ("No local store database exists yet", holds=unknown), which is the correct
# output here rather than a workaround.
apiVersion: batch/v1
kind: Job
metadata:
  name: safe-agents-posture
  namespace: safe-agents
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safe-agents
        # Same selector as the agent pod — see 60-networkpolicy.yaml. Dropping this
        # would let the report be generated in a pod with full egress while
        # describing one without.
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: safe-agents-agent
      restartPolicy: Never
      containers:
        - name: posture
          image: image-registry.openshift-image-registry.svc:5000/safe-agents/safe-agents-missileer:arc
          imagePullPolicy: Always
          command: ["bash", "/opt/drill/cluster-posture.sh"]
          env:
            - { name: POSTURE_HOME, value: "/tmp/posture-home" }
            - { name: POSTURE_PROJECT, value: "/tmp/posture-project" }
            # Reported in the banner so the reader can see which principal's view
            # this is, without trusting the report to tell them.
            - name: POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef: { fieldPath: spec.serviceAccountName }
          volumeMounts:
            - { name: drill, mountPath: /opt/drill, readOnly: true }
      volumes:
        - name: drill
          configMap:
            name: safe-agents-drill-scripts
