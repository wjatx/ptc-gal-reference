# Four ServiceAccounts, split now so that Phase 3 changes the identity
# DERIVATION and the RBAC without moving the topology underneath it.
#
# Phase 2 does not yet use them as ceremony identities — the ceremony runs on the
# local-solo arm and says so in the signed record's `attestation` field. What the
# split buys today is that the issuer Secret is grantable to `checker` alone, and
# that is the maker != checker backstop the cloud floor actually relies on:
# MakerRole carries ZERO secretsmanager statements ("Deliberately NO */issuer/*
# (the maker cannot sign a record)", infra/lib/identity-stack.ts), so a maker can
# write a row but cannot produce a VALIDLY SIGNED one. Store-write exclusion is
# #203 and is open on both substrates; do not claim it here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: safe-agents-maker
  namespace: safe-agents
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: safe-agents-checker
  namespace: safe-agents
---
# The runtime identity for a broker that only SERVES (no ceremony, no signing).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: safe-agents-broker
  namespace: safe-agents
---
# Phase 4. The AGENT's identity, and the whole point of it is what it is not
# granted: no RoleBinding (like every other SA in this arm), no volume carrying a
# secret, and no mount of the PVC at all. It exists so that the agent pod is a
# DIFFERENT principal from the broker pod rather than a second container beside
# it — which is the difference between a boundary the platform enforces and a
# convention our code observes.
#
# Do not add a RoleBinding here to "let the agent check something". The Phase 4
# drill reaches the API server precisely so that its refusal is an RBAC 403 with
# a nameable mechanism; a binding that made any of those calls succeed would
# convert a proof into a hole.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: safe-agents-agent
  namespace: safe-agents
---
# Phase 5. The peer agent's airlock endpoint — a FIFTH principal, and like the agent
# it is defined by what it is not given: no PVC, no connector secret, no RoleBinding.
# It holds the shared transport token, which is a credential for talking TO it rather
# than one it can spend anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: safe-agents-peer
  namespace: safe-agents
