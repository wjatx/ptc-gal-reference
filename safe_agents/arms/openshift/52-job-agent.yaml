# The agent leg (#250 Phase 4) — the pod the whole phase is about.
#
# Read this spec for what is ABSENT. There is no PVC mount, so the store, the grant
# key space and the audit tape are not reachable from here at any permission level.
# There is no Secret volume, so no connector credential and no issuer key. There is
# no RoleBinding on its ServiceAccount, so it cannot ask the API for either. The only
# volume is the drill ConfigMap, which is the script below reading itself.
#
# That absence is the deliverable. Every other leg in this arm proves something about
# what a credential can do; this one proves what a workload holding none can reach.
apiVersion: batch/v1
kind: Job
metadata:
  name: safe-agents-agent
  namespace: safe-agents
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safe-agents
        # This label is not cosmetic: it is the selector 60-networkpolicy.yaml uses
        # to make this pod default-deny on egress. Change or drop it and the pod
        # silently regains full network reach while the drill still runs -- and the
        # egress checks would then FAIL loudly, which is the correct polarity. Verify
        # that is still true before ever relaxing them.
        app.kubernetes.io/component: agent
    spec:
      # Not the broker's identity, and not either ceremony identity. A fourth
      # principal, granted nothing.
      serviceAccountName: safe-agents-agent
      restartPolicy: Never
      containers:
        - name: agent
          # The same image, deliberately. A purpose-built minimal agent image would
          # look tidier and would be a SECOND build path -- the exact drift
          # 20-builds.yaml exists to avoid. The script asserts it uses no safe_agents
          # import, so sharing the image costs the proof nothing.
          image: image-registry.openshift-image-registry.svc:5000/safe-agents/safe-agents-missileer:arc
          imagePullPolicy: Always
          command: ["bash", "/opt/drill/cluster-agent.sh"]
          env:
            # The Service, by DNS name. Resolving it is itself part of the proof:
            # cluster DNS is allowed, so the agent CAN look things up, and still
            # cannot connect to anything but this.
            - { name: AGENT_BROKER_URL, value: "http://safe-agents-broker.safe-agents.svc:8080" }
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
          volumeMounts:
            - { name: drill, mountPath: /opt/drill, readOnly: true }
      volumes:
        - name: drill
          configMap:
            name: safe-agents-drill-scripts
