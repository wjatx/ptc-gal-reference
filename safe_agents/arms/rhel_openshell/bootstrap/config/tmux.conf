# tmux configuration for Claude Code sessions.
# Faithful snapshot from a development harness (config/tmux.conf).
# Used in SA_PROFILE=interactive only (bootstrap.sh copies to ~/.tmux.conf).

# Enable mouse support
set -g mouse on

# Mouse copy/paste
set -s set-clipboard on
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -n MouseDown2Pane run "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer"

# Scrollback buffer
set -g history-limit 10000

# Window numbering starts at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 256 color support
set -g default-terminal "screen-256color"

# Status bar
set -g status-style bg=colour234,fg=colour137
set -g status-left '#[fg=colour233,bg=colour245,bold] #S '
set -g status-right '#[fg=colour233,bg=colour245,bold] %Y-%m-%d %H:%M '
set -g status-left-length 20
set -g status-right-length 50

# Active window highlighting
setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

# Inactive window
setw -g window-status-style fg=colour138,bg=colour235,none
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# Pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour51

# Message text
set -g message-style bg=colour235,fg=colour166

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Pane splitting
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
