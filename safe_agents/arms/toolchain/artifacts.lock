# artifacts.lock: every third-party file the substrate arms download, pinned.
#
# One file per line, five whitespace-separated columns:
#
#     name  platform  version  sha256  url
#
# platform is linux-x86_64, linux-aarch64 or any. Lines are sorted by name, then
# platform. Shell reads a line with awk and needs no other parser:
#
#     awk '$1 == "node" && $2 == "linux-x86_64" { print $4, $5 }' artifacts.lock
#
# Install scripts do not read this file at run time. They carry the url and sha256
# of one line as literals (fetch-verified.sh), and
# safe_agents/arms/tests/test_pinned_fetches.py fails when a script carries a pair
# that is not a line here. Move a pin with scripts/update-artifact-pin.py, which
# downloads the file, recomputes the hash, and rewrites this line and every use.
# README.md in this directory has the rest.
